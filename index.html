<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Osito Cupping Lab</title>
    <!-- Without these, "Add to Home Screen" creates a plain bookmark, not an installed app — and a
         plain bookmark opened with no network at all can hit the browser's own offline page before
         the service worker (which has the app cached) ever gets a chance to respond. -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="icon" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="theme-color" content="#252b23" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cupping Lab" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
